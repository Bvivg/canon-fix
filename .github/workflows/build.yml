name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия сборки
        id: ver
        shell: bash
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish (single-file, self-contained, win-x64)
        run: dotnet publish launcher/CanonFix.csproj -c Release -r win-x64 -p:Version=${{ steps.ver.outputs.version }} -o out

      - name: Самопроверка exe на Windows
        run: .\out\CanonFix.exe --selftest

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: CanonFix-${{ steps.ver.outputs.version }}
          path: out/CanonFix.exe

      - name: Release "latest"
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          skill_version=$(cat skills/canon-mf460-fix/VERSION)
          {
            echo "Сборка ${VERSION} из коммита ${SHA}."
            echo
            echo "Скилл canon-mf460-fix: версия ${skill_version}."
            echo
            echo "Скачайте CanonFix.exe на флешку и запустите на нужном ПК от администратора. Подробности — в README."
          } > notes.md

          gh release delete latest --cleanup-tag --yes || true
          # дождаться, пока GitHub действительно уберёт релиз и тег,
          # иначе следующий create проходит, а ассет молча теряется
          for i in $(seq 1 15); do
            gh release view latest >/dev/null 2>&1 || break
            sleep 4
          done

          gh release create latest \
            --target "${SHA}" \
            --title "CanonFix ${VERSION}" \
            --latest \
            --notes-file notes.md

          # дальше работаем по id: ответы на запрос релиза по тегу
          # у GitHub бывают устаревшими и показывают релиз без вложений
          rel_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id')
          echo "release_id=${rel_id}" >> "$GITHUB_OUTPUT"

      - name: Приложить exe к релизу
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload latest out/CanonFix.exe --clobber && break
            echo "попытка $i не удалась, повтор через 10 с"
            sleep 10
          done

      - name: Проверить, что exe лежит в релизе
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL_ID: ${{ steps.rel.outputs.release_id }}
        run: |
          size=0
          for i in 1 2 3 4 5; do
            size=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets" \
                     --jq '[.[] | select(.name == "CanonFix.exe" and .state == "uploaded")][0].size // 0')
            [ "${size}" -ge 10000000 ] && break
            echo "вложение ещё не видно (попытка ${i}), жду 10 с"
            sleep 10
          done
          echo "CanonFix.exe в релизе latest: ${size} байт"
          if [ "${size}" -lt 10000000 ]; then
            echo "::error::CanonFix.exe не попал в релиз latest (размер ${size})"
            exit 1
          fi
          curl -sfIL "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/CanonFix.exe" \
            -o /dev/null -w 'download link: HTTP %{http_code}\n'
